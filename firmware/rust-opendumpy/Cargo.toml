[package]
name = "rust-opendumpy"
version = "0.1.0"
edition = "2024"

[dependencies]
rp235x-hal = { version = "0.4.0", features = ["critical-section-impl", "rt", "defmt"] }
rp235x-pac = "0.2.0"
embedded-hal = "1.0.0"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
heapless = "0.9.3"
critical-section = "1.2.0"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
debug = 2
opt-level = 1
lto = false
codegen-units = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
